# Grype suppressions for RiskHub container scanning.
# Keep this list minimal and time-bound.
#
# Required fields for each suppression entry:
# - vulnerability: CVE identifier
# - reason: why accepted, including Owner, Decision, Scanner evidence, No-fix proof,
#   Reachability, and Exit
# - expires-on: YYYY-MM-DD
# - package.name: affected package
# - package.version: affected version (or range rationale in reason)
# - namespace, fix-state, and match-type: exact vulnerability-match selectors
# - package.type, package.location, and package.upstream-name: exact scanner artifact selectors
#
# Example:
# ignore:
#   - vulnerability: CVE-2099-0001
#     reason: "Owner: Platform. Decision: temporary acceptance. Scanner evidence: Grype reports the exact affected package. No-fix proof: upstream has not released a fixed version. Reachability: the vulnerable path is not used. Exit: upgrade the affected package and remove this rule."
#     namespace: nvd:cpe
#     fix-state: unknown
#     match-type: cpe-match
#     expires-on: 2026-09-30
#     package:
#       name: python
#       version: 3.13.0
#       type: binary
#       location: /usr/local/bin/python3.13
#       upstream-name: python

ignore: []
