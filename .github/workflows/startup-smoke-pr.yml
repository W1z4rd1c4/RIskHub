name: Startup Smoke PR

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  docker-onboarding-smoke:
    name: Docker Onboarding Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Docker onboarding smoke
        uses: ./.github/actions/docker-onboarding-smoke
        with:
          artifact-name: startup-smoke-pr
