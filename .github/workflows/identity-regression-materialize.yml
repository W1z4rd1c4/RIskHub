name: Identity Regression Candidate Assembly

on:
  pull_request:
    paths:
      - '.github/workflows/identity-regression-materialize.yml'

permissions:
  contents: read

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/identity-group-1-foundations' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: f521ca47c885cc2971c023d2084b914fb5a37a6a
          persist-credentials: false
      - name: Materialize fixed source and workflow blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import subprocess
          import urllib.request

          BASE = '77a368a26f7c1be6d8589681c1d1e24275d90c6f'
          EXPECTED = '2024588dc9623a156d90af98a73b11090c98256a'
          FINAL = '52432f7174dadf5ebb0f6b9f5b936a7329433a11'
          BLOB = '931440e6f0d04c3a5a0dd2e0a52dd1d875e5581c'
          API = 'https://api.github.com/repos/W1z4rd1c4/RiskHub'

          def api(path, payload=None):
              if path not in ('/git/blobs/' + BLOB, '/git/blobs', '/git/trees'):
                  raise RuntimeError('Unapproved operation')
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(API + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def git(*args):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args])

          if git('rev-parse', 'HEAD^{tree}').decode().strip() != BASE:
              raise RuntimeError('Base tree mismatch')
          blob = api('/git/blobs/' + BLOB)
          compressed = base64.b64decode(blob['content'])
          if len(compressed) != 3436 or hashlib.sha256(compressed).hexdigest() != 'd20e2cf3bc17d98f1b26dbe9f3b6b6f4d760b1fd77e96c19edb8b1ea367d787c':
              raise RuntimeError('Compressed patch mismatch')
          patch = lzma.decompress(compressed, memlimit=268435456)
          if len(patch) != 13873 or hashlib.sha256(patch).hexdigest() != '60ebb2ef5354d213a1a1808565f048efac1c4689f362dc6c3f995c30a65886e7':
              raise RuntimeError('Patch mismatch')
          subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', 'apply', '--index', '--whitespace=error'], input=patch, check=True)
          if git('write-tree').decode().strip() != EXPECTED:
              raise RuntimeError('Candidate tree mismatch')
          paths = [p.decode() for p in git('diff', '--cached', '--name-only', '-z').split(b'\0') if p]
          if len(paths) != 10 or any(not p.startswith(('backend/app/', 'tests/backend/pytest/', 'scripts/security/')) for p in paths):
              raise RuntimeError('Unexpected changed paths')
          tree = []
          for path in paths:
              entry = git('ls-files', '--stage', '--', path).decode().split()
              if entry[0] not in ('100644', '100755') or entry[2] != '0':
                  raise RuntimeError('Unexpected file mode or index stage')
              content = git('cat-file', 'blob', entry[1]).decode('utf-8')
              tree.append({'path': path, 'mode': entry[0], 'type': 'blob', 'content': content})
          result = api('/git/trees', {'base_tree': BASE, 'tree': tree})
          if result['sha'] != EXPECTED:
              raise RuntimeError('Published object tree mismatch')
          print('VERIFIED_NONWORKFLOW_TREE=' + result['sha'])

          workflows = ['backend-postgres.yml', 'e2e.yml', 'frontend-container-gate-contract.yml', 'identity-foundations.yml', 'lint.yml', 'maintenance-governance.yml', 'security.yml', 'startup-smoke-pr.yml']
          for name in workflows:
              path = pathlib.Path('.github/workflows') / name
              content = path.read_text()
              old = '  pull_request:\n    branches: [main, develop]'
              if old in content:
                  content = content.replace(old, '  pull_request:\n    branches: [main, develop, "feat/identity-group-*"]', 1)
              else:
                  content = content.replace('  pull_request:\n    branches: [main]', '  pull_request:\n    branches: [main, "feat/identity-group-*"]', 1)
              if name == 'e2e.yml':
                  content = content.replace('          alembic upgrade head\n          uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../prod-smoke-backend.log', '          alembic upgrade head\n          # The disposable database is fresh; use the real operator binding path.\n          python -m scripts.identity_installation initialize --maintenance-confirmed --source "ci-production-smoke"\n          python -m scripts.identity_installation verify\n          uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../prod-smoke-backend.log')
              if name == 'identity-foundations.yml':
                  content = content.replace('pytest ../tests/backend/pytest/test_identity_foundations.py', 'pytest ../tests/backend/pytest/test_identity_authority_loading.py ../tests/backend/pytest/test_users.py ../tests/backend/pytest/test_identity_foundations.py')
              path.write_text(content)
              git('add', '--', str(path))
          if git('write-tree').decode().strip() != FINAL:
              raise RuntimeError('Workflow changes differ from tested candidate')
          for name in workflows:
              path = '.github/workflows/' + name
              sha = git('hash-object', path).decode().strip()
              result = api('/git/blobs', {'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'})
              if result['sha'] != sha:
                  raise RuntimeError('Workflow blob mismatch')
              print(path + ' ' + sha)
          print('VERIFIED_FINAL_TREE=' + FINAL)
          print('No application execution, workflow-tree publication, commit creation, or ref update.')
          PY
