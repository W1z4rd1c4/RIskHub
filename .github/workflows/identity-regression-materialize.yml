name: Identity Regression Candidate Assembly
on:
  pull_request:
    paths:
      - '.github/workflows/identity-regression-materialize.yml'
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/identity-group-1-foundations' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 86191772c29fa988469e7498472cf07ceba14f40
          path: foundations
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 9cbc61a7ac337a59ffbde53383da06aa31882cc3
          path: native
          persist-credentials: false
      - name: Assemble fixed source objects only; never run code or change refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import subprocess
          import urllib.request

          API = 'https://api.github.com/repos/W1z4rd1c4/RiskHub'
          CHUNKS = ['1d913b2861e5eb7274dc1432528f051d70cc3f9f', '543583092fc70ed3aaf36a52a9fcf1ec14f7c4d5']
          ALLOWED = {'/git/trees', '/git/blobs', *('/git/blobs/' + sha for sha in CHUNKS)}

          def api(path, payload=None):
              if path not in ALLOWED:
                  raise RuntimeError('Unapproved Git operation')
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(API + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def git(root, *args):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args], cwd=root)

          compressed = b''.join(base64.b64decode(api('/git/blobs/' + sha)['content']) for sha in CHUNKS)
          if len(compressed) != 12640 or hashlib.sha256(compressed).hexdigest() != '7dcd904901e14a6c7e85367dbb6d77cc4fbcd78c9b5e6a9a1cddef2c323939fa':
              raise RuntimeError('Compressed bundle mismatch')
          raw = lzma.decompress(compressed, memlimit=268435456)
          if len(raw) != 166611 or hashlib.sha256(raw).hexdigest() != '7f79f64934c8135e8b7ce3f853701351ca65e77a55125a3039058a67b98f6359':
              raise RuntimeError('Patch bundle mismatch')
          patches = json.loads(raw)
          candidates = [
              ('repo1', 'foundations', '27c84bbf64d8c1a79c8e0d475df5c1b4dbc4380f', 'b92baf7add7e37436e1dcff8ce5da7ebcdf793cc', 16),
              ('repo2', 'native', 'f9ede1632eb041e3fb1c699ee4f7214aefb2bd2c', 'f3ea48e65e813ce705129b17d61ee3116cf10ac4', 18),
          ]
          for key, root, base, expected, count in candidates:
              if git(root, 'rev-parse', 'HEAD^{tree}').decode().strip() != base:
                  raise RuntimeError('Unexpected source base')
              patch = patches[key].encode()
              subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', 'apply', '--index', '--whitespace=error'], input=patch, cwd=root, check=True)
              if git(root, 'write-tree').decode().strip() != expected:
                  raise RuntimeError('Candidate differs from locally checked tree')
              paths = [p.decode() for p in git(root, 'diff', '--cached', '--name-only', '-z').split(b'\0') if p]
              if len(paths) != count or any(p.startswith('.github/') for p in paths):
                  raise RuntimeError('Unexpected paths or workflow mutation')
              tree = []
              for path in paths:
                  entry = git(root, 'ls-files', '--stage', '--', path).decode().split()
                  if entry[0] not in ('100644', '100755') or entry[2] != '0':
                      raise RuntimeError('Unexpected mode or stage')
                  tree.append({'path': path, 'mode': entry[0], 'type': 'blob', 'content': git(root, 'cat-file', 'blob', entry[1]).decode()})
              result = api('/git/trees', {'base_tree': base, 'tree': tree})
              if result['sha'] != expected:
                  raise RuntimeError('Remote object identity mismatch')
              print(key + '_VERIFIED_TREE=' + result['sha'])
          path = pathlib.Path('native/.github/workflows/identity-local.yml')
          content = path.read_text()
          if content.count('image: redis:7-alpine') != 1:
              raise RuntimeError('Unexpected Redis image source')
          content = content.replace('image: redis:7-alpine', 'image: redis:7@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0')
          path.write_text(content)
          git('native', 'add', '--', '.github/workflows/identity-local.yml')
          if git('native', 'write-tree').decode().strip() != 'f00db89e54c005cd17201a8d902bfc3c90092b5d':
              raise RuntimeError('Final native workflow tree mismatch')
          result = api('/git/blobs', {'content': content, 'encoding': 'utf-8'})
          if result['sha'] != git('native', 'hash-object', '.github/workflows/identity-local.yml').decode().strip():
              raise RuntimeError('Workflow object mismatch')
          print('NATIVE_PINNED_WORKFLOW_BLOB=' + result['sha'])
          print('No application/test execution, commit creation, or branch-ref update.')
          PY
