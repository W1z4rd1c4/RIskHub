name: Frontend Container Gate Contract

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/frontend-container-gate-contract.yml'
      - '.github/workflows/security.yml'
      - 'scripts/security/frontend_trivy_status.py'
      - 'scripts/security/validate_frontend_container_gate.py'
      - 'tests/backend/pytest/test_frontend_container_security_contract.py'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/frontend-container-gate-contract.yml'
      - '.github/workflows/security.yml'
      - 'scripts/security/frontend_trivy_status.py'
      - 'scripts/security/validate_frontend_container_gate.py'
      - 'tests/backend/pytest/test_frontend_container_security_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  injected-finding-contract:
    name: Frontend Container Injected Finding Contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pinned workflow parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Generate injected Trivy SARIF finding
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "$schema": "https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "Trivy",
                              "fullName": "Trivy Vulnerability Scanner",
                              "informationUri": "https://github.com/aquasecurity/trivy",
                              "rules": [
                                  {
                                      "id": "CVE-INJECTED-CONTRACT",
                                      "name": "InjectedContainerVulnerability",
                                      "shortDescription": {
                                          "text": "Injected qualifying frontend container finding"
                                      },
                                      "defaultConfiguration": {"level": "error"},
                                      "properties": {
                                          "security-severity": "9.8",
                                          "tags": [
                                              "vulnerability",
                                              "security",
                                              "CRITICAL"
                                          ],
                                      },
                                  }
                              ],
                          }
                      },
                      "results": [
                          {
                              "ruleId": "CVE-INJECTED-CONTRACT",
                              "ruleIndex": 0,
                              "level": "error",
                              "message": {
                                  "text": "Injected qualifying frontend container finding"
                              },
                          }
                      ],
                  }
              ],
          }
          Path("trivy-frontend-injected.sarif").write_text(
              json.dumps(payload) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Record injected frontend finding
        run: |
          python3 scripts/security/frontend_trivy_status.py record \
            --outcome success \
            --sarif trivy-frontend-injected.sarif \
            --output trivy-frontend-injected-status.json

      - name: Prove injected finding is blocked
        run: |
          set -euo pipefail
          if python3 scripts/security/frontend_trivy_status.py enforce \
            --status-file trivy-frontend-injected-status.json; then
            echo "Frontend container gate accepted an injected qualifying finding." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("trivy-frontend-injected-status.json").read_text(encoding="utf-8")
          )
          assert payload["status"] == "findings", payload
          assert payload["finding_count"] == 1, payload
          assert payload["scanner"] == "trivy", payload
          assert payload["image"] == "riskhub-frontend:scan", payload
          print("Injected CRITICAL frontend Trivy finding was rejected as required.")
          PY

      - name: Validate production workflow contract
        run: python3 scripts/security/validate_frontend_container_gate.py

      - name: Verify injected-finding evidence files
        if: always()
        run: |
          set -euo pipefail
          test -f trivy-frontend-injected.sarif
          test -f trivy-frontend-injected-status.json

      - name: Upload injected-finding evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-container-injected-finding-evidence
          path: |
            trivy-frontend-injected.sarif
            trivy-frontend-injected-status.json
          retention-days: 30
          if-no-files-found: error
