name: Native Identity Candidate Materialization
on:
  pull_request:
    paths: ['.github/workflows/identity-group2-materialize.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/identity-group-2-local-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 124313f35c13fc5a572fa4fd9e9ad0a3b3572c2e
          persist-credentials: false
      - name: Verify fixed correction bytes and create only non-workflow Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          BASE = 'fc1b583ed15554958f7b446b178388c1f029b21e'
          EXPECTED = 'f96228d7b9f5d4a28776ddfb8995fd440329cc43'
          PARTIAL = '33624f69b0b857077ccf722ffb05eebef89f583b'
          ENCODED = ''
          def git(*args):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args])
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == BASE
          patch = lzma.decompress(base64.b64decode(ENCODED), memlimit=268435456)
          assert len(patch) == 7317 and hashlib.sha256(patch).hexdigest() == '598ac621be4ba8fd039cacd52706bd8f9d1da34e8ccf820e229d135fd1137e08'
          subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', 'apply', '--index', '--whitespace=error'], input=patch, check=True)
          assert git('write-tree').decode().strip() == EXPECTED
          entries = {}
          for item in git('ls-files', '--stage', '-z').split(b'\0'):
              if item:
                  metadata, path = item.split(b'\t', 1)
                  mode, sha, stage = metadata.decode().split()
                  assert stage == '0'
                  entries[path.decode()] = (mode, sha)
          tree = []
          for raw in git('diff', '--cached', '--no-renames', '--name-only', '-z').split(b'\0'):
              if not raw or raw.startswith(b'.github/'):
                  continue
              path = raw.decode()
              mode, sha = entries[path]
              tree.append({'path': path, 'mode': mode, 'type': 'blob', 'content': git('cat-file', 'blob', sha).decode()})
          request = urllib.request.Request('https://api.github.com/repos/W1z4rd1c4/RiskHub/git/trees', method='POST', data=json.dumps({'base_tree': BASE, 'tree': tree}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == PARTIAL, result['sha']
          print('VERIFIED_NON_WORKFLOW_TREE=' + result['sha'])
          print('No application execution, workflow publication, commit or ref update.')
          PY
