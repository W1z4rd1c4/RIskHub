name: Startup Smoke

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-onboarding-smoke:
    name: Docker Onboarding Smoke (Scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Run Docker onboarding smoke
        uses: ./.github/actions/docker-onboarding-smoke
        with:
          artifact-name: startup-smoke
