# Temporary transport for PR #209. Not part of the final candidate tree.
# Creates only an unreachable, precomputed Git tree; never updates a branch,
# executes application code, or exposes a repository credential.
name: Identity Candidate Materialization
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/identity-candidate-once.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: >-
      github.repository == 'W1z4rd1c4/RiskHub' &&
      github.event.pull_request.number == 209 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/identity-group-1-foundations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the prepared patch and materialize its immutable tree
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import bz2
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          BASE = 'c428eca638a2ec2caf93012970855fba7ffce75a'
          BASE_TREE = '87b14a3d3e252e02130674273127291b795f661c'
          EXPECTED_TREE = '4739f0487a353703c1c6da26ccbf691a63e422ad'
          PATCH_SHA = 'cad75d3699151070df3e8ddf845472575d2ae3b4cad3901da8887690f0dc69e5'
          PACKED_SHA = 'd78fbf0ff6462c90f391ca81c980376ad6d4dca88a2728570662b83c6b1df115'
          BLOBS = [
              '0d5b8f7764f22f5d4cdd5b242eaf1072c0615a41',
              '97bb4a1d1f6591da89c4875adbbc8963ef3a7765',
              'e6cb95c3e3d5d6e70ad378da364ae3aa5cd8fe46',
              '4dd0b5805b1b37ca1621d88414caee8bb9a7e272',
              '5e5b7038ebebd1dcb959e807cd30cbc506483f7b',
          ]
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()

          head = git('rev-parse', 'HEAD')
          assert head == os.environ['PR_HEAD'], 'Unexpected checkout'
          assert git('rev-parse', 'HEAD^') == BASE, 'Branch moved; re-prepare rather than overwrite'
          assert git('rev-parse', BASE + '^{tree}') == BASE_TREE
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['number'] == 209
          assert event['pull_request']['head']['repo']['full_name'] == 'W1z4rd1c4/RiskHub'
          assert event['pull_request']['head']['ref'] == 'feat/identity-group-1-foundations'

          def api(path, payload=None):
              assert path.startswith(('git/blobs/', 'git/trees'))
              req = urllib.request.Request(
                  'https://api.github.com/repos/W1z4rd1c4/RiskHub/' + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method='GET' if payload is None else 'POST',
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)

          chunks = []
          for sha in BLOBS:
              data = api('git/blobs/' + sha)
              assert data['encoding'] == 'base64'
              value = base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest() == sha
              chunks.append(value)
          packed = b''.join(chunks)
          assert len(packed) == 42563
          assert hashlib.sha256(packed).hexdigest() == PACKED_SHA
          decoder = bz2.BZ2Decompressor()
          patch = decoder.decompress(packed, max_length=500001)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 244062 and hashlib.sha256(patch).hexdigest() == PATCH_SHA
          patch_path = Path(os.environ['RUNNER_TEMP']) / 'identity-group1.patch'
          patch_path.write_bytes(patch)

          # Remove temporary transport from the index before applying the exact
          # product diff. The shell/Python program is already held in memory.
          subprocess.run(['git', 'read-tree', '--reset', '-u', BASE], check=True)
          subprocess.run(['git', 'apply', '--index', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          assert git('write-tree') == EXPECTED_TREE, 'Candidate bytes differ from locally tested tree'
          paths = git('diff', '--cached', '--name-only', BASE).splitlines()
          assert len(paths) == 55
          assert all(not p.startswith('.github/') for p in paths)
          entries = []
          for path in paths:
              record = git('ls-files', '--stage', '--', path)
              mode = record.split()[0]
              assert mode in ('100644', '100755')
              content = Path(path).read_text(encoding='utf-8')
              assert len(content.encode()) < 1000000
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': content})
          tree = api('git/trees', {'base_tree': BASE_TREE, 'tree': entries})
          assert tree['sha'] == EXPECTED_TREE, 'GitHub tree differs from local verification'
          out = Path(os.environ['RUNNER_TEMP']) / 'identity-candidate'
          out.mkdir()
          (out / 'candidate.json').write_text(json.dumps({
              'transport_parent': head, 'base_commit': BASE, 'tree': tree['sha'],
              'patch_sha256': PATCH_SHA, 'changed_paths': paths,
              'branch_updated': False, 'application_code_executed': False,
          }, indent=2) + '\n')
          print('Verified candidate tree:', tree['sha'])
          print('No branch ref or commit was written by this workflow.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/identity-candidate/
          retention-days: 7
          if-no-files-found: error
