# One-time, fixed-hash transport for PR #209; absent from the final tree.
name: Identity Candidate Materialization
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/identity-candidate-once.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == 'W1z4rd1c4/RiskHub' && github.event.pull_request.number == 209 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/identity-group-1-foundations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify fixed source patch and create unreachable candidate tree
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          BASE = 'dc06790f3ae2ea38bdfd33938dfad3998c08dc3b'
          TREE = '77a368a26f7c1be6d8589681c1d1e24275d90c6f'
          PACKED = ''
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD') == os.environ['PR_HEAD']
          assert git('rev-parse', 'HEAD^') == BASE
          assert git('rev-parse', BASE + '^{tree}') == '55fae613d17d5eddb1008d7126541813ba978574'
          decoder = bz2.BZ2Decompressor()
          patch = decoder.decompress(base64.b64decode(PACKED), max_length=12000)
          assert decoder.eof and not decoder.unused_data and len(patch) == 11633
          assert hashlib.sha256(patch).hexdigest() == '1026aba32062cf20ba0d10cfdcb47945fa5c2233e890ca43f4c5f361ab34ce79'
          path = Path(os.environ['RUNNER_TEMP']) / 'verified-identity.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'read-tree', '--reset', '-u', BASE], check=True)
          subprocess.run(['git', 'apply', '--index', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          assert git('write-tree') == TREE
          paths = git('diff', '--cached', '--name-only', '--no-renames', BASE).splitlines()
          assert len(paths) == 7 and all(not p.startswith('.github/') for p in paths)
          entries = []
          for name in paths:
              entry = {'path': name, 'mode': '100644', 'type': 'blob'}
              if not git('ls-files', '--stage', '--', name):
                  entry['sha'] = None
              else:
                  entry['content'] = Path(name).read_text(encoding='utf-8')
              entries.append(entry)
          req = urllib.request.Request(
              'https://api.github.com/repos/W1z4rd1c4/RiskHub/git/trees',
              data=json.dumps({'base_tree': '55fae613d17d5eddb1008d7126541813ba978574', 'tree': entries}).encode(),
              method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(req, timeout=45) as response:
              result = json.load(response)
          assert result['sha'] == TREE
          print('Verified candidate tree:', TREE)
          print('No ref updated, no product code executed, no credential printed.')
          PY
