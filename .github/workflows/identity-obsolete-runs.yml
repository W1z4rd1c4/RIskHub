name: Retire superseded identity PR attempts
on:
  push:
    branches: ['ci/identity-obsolete-run-cleanup']
permissions:
  actions: write
  contents: read
jobs:
  retire:
    if: github.repository == 'W1z4rd1c4/RiskHub' && github.ref == 'refs/heads/ci/identity-obsolete-run-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only obsolete in-flight attempts; preserve current heads and all history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          API = 'https://api.github.com/repos/W1z4rd1c4/RiskHub'
          KEEP = {
              'feat/identity-group-1-foundations': '41a6f631367968e78597fde6654659b9685f902a',
              'feat/identity-group-2-local-auth': '125de63e7c482fe38f13df36c9ce9ef57d577cfa',
          }

          def api(path, method='GET'):
              request = urllib.request.Request(API + path, method=method, data=b'' if method == 'POST' else None, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          def verify_heads():
              for branch, sha in KEEP.items():
                  if api('/git/ref/heads/' + branch)['object']['sha'] != sha:
                      raise RuntimeError('A PR head changed; stop without cancelling additional runs')

          verify_heads()
          obsolete = {}
          for status in ('queued', 'in_progress'):
              for page in range(1, 6):
                  batch = api('/actions/runs?event=pull_request&status=' + status + '&per_page=100&page=' + str(page))['workflow_runs']
                  for run in batch:
                      branch = run.get('head_branch')
                      if branch in KEEP and run.get('head_sha') != KEEP[branch] and run.get('head_repository', {}).get('full_name') == 'W1z4rd1c4/RiskHub':
                          obsolete[run['id']] = run
                  if len(batch) < 100:
                      break
          cancelled = 0
          for run_id, run in sorted(obsolete.items()):
              verify_heads()
              current = api('/actions/runs/' + str(run_id))
              branch = current.get('head_branch')
              if branch not in KEEP or current.get('head_sha') == KEEP[branch] or current.get('event') != 'pull_request':
                  raise RuntimeError('Run no longer matches the restricted obsolete-attempt scope')
              if current.get('status') == 'completed':
                  continue
              try:
                  api('/actions/runs/' + str(run_id) + '/cancel', method='POST')
              except urllib.error.HTTPError as exc:
                  if exc.code != 409:
                      raise
                  print('Run no longer cancellable: ' + str(run_id))
              else:
                  cancelled += 1
                  print('Cancellation requested for superseded run ' + str(run_id) + ' at ' + current['head_sha'])
          print('Superseded cancellation requests=' + str(cancelled))
          print('Current-head runs retained; completed results and logs were not deleted. No ref, branch protection, code, or deployment changes.')
          PY
