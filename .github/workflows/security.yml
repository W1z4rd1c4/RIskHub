# RiskHub Security Scanning Workflow
# Runs security scans on every PR and push to main

name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 02:00 UTC for resilience smoke checks
    - cron: '0 2 * * *'
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  public-repo-hygiene:
    name: Public Repo Hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate tracked public repo hygiene
        run: python3 scripts/security/validate_public_repo_hygiene.py

  workflow-pin-validation:
    name: Workflow Pin Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate workflow action and image pins
        run: python3 scripts/security/validate_workflow_pins.py

      - name: Validate repository hardening invariants
        run: python3 scripts/security/validate_repo_hardening.py

  authz-capability-contract:
    name: Authorization Capability Contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate authorization capability contract
        run: python3 scripts/security/validate_authz_capability_contract.py --base-ref HEAD

  # Python Security Scans
  python-security:
    name: Python Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-db.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "pip-audit>=2.7.0"

      - name: Run Bandit (SAST, high severity gate)
        run: |
          set -euo pipefail
          bandit --ini .bandit -r app -f json -o bandit-report.json --exit-zero
          bandit --ini .bandit -r app -f txt --severity-level high
          python - <<'PY'
          import json
          import sys

          with open("bandit-report.json", "r", encoding="utf-8") as fh:
              report = json.load(fh)
          high = [item for item in report.get("results", []) if item.get("issue_severity") == "HIGH"]
          if high:
              print(f"Bandit high-severity findings: {len(high)}")
              for finding in high[:20]:
                  print(
                      f"- {finding.get('filename')}:{finding.get('line_number')} "
                      f"{finding.get('test_id')} {finding.get('issue_text')}"
                  )
              sys.exit(1)
          print("Bandit high-severity findings: 0")
          PY

      - name: Run pip-audit (Dependency Scan with allowlist)
        run: |
          set -euo pipefail
          python ../scripts/security/ci_health.py run-python-audit --workdir .

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

      - name: Upload pip-audit Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-report
          path: |
            backend/pip-audit-report.json
            backend/pip-audit-runtime-report.json
          retention-days: 30

  # Frontend Security Scans
  frontend-security:
    name: Frontend Security (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          set -euo pipefail
          npm audit --json > npm-audit-report.json || true
          npm audit --audit-level=high

      - name: Upload npm audit Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30

  # Frontend i18n Quality Gates
  frontend-i18n:
    name: Frontend i18n (Parity + Hardcoded Scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run i18n test gate
        run: npm run i18n:test

  # Redis resilience integration (non-blocking during initial rollout)
  redis-resilience-integration:
    name: Redis Resilience Integration (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run redis integration resilience test
        run: pytest ../tests/backend/pytest/test_rate_limit_redis_integration.py -m redis_integration -q

      - name: Upload redis resilience artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-resilience-integration
          path: |
            backend/.pytest_cache
          retention-days: 7

  # Container Security Scan
  container-security:
    name: Container Scan (Trivy + SBOM Correlation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Backend Image
        run: docker build -t riskhub-backend:scan -f backend/Dockerfile backend/

      - name: Build Frontend Image
        run: docker build -t riskhub-frontend:scan -f frontend/Dockerfile frontend/

      - name: Run Trivy on Backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'riskhub-backend:scan'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Frontend
        id: trivy_frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'riskhub-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Record Frontend Trivy Scan Status
        if: always()
        env:
          FRONTEND_TRIVY_OUTCOME: ${{ steps.trivy_frontend.outcome }}
        run: |
          python3 scripts/security/frontend_trivy_status.py record \
            --outcome "$FRONTEND_TRIVY_OUTCOME" \
            --sarif trivy-frontend.sarif \
            --output trivy-frontend-status.json

      - name: Enforce Frontend Trivy HIGH/CRITICAL Gate
        if: always()
        run: >-
          python3 scripts/security/frontend_trivy_status.py enforce
          --status-file trivy-frontend-status.json

      - name: Generate Backend SBOM (Syft)
        if: always()
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:/repo" \
            anchore/syft:v1.42.3@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36 riskhub-backend:scan -o json > sbom-backend.json

      - name: Run Grype on Backend SBOM
        if: always()
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            anchore/grype:v0.110.0@sha256:af65fbc0c664691067788fe95ff88760b435543e45595eb2ca6f102fc476fbe1 \
            sbom:/repo/sbom-backend.json \
            --config /repo/backend/security/grype-ignore.yaml \
            -o json > grype-backend.json

      - name: Fail on unresolved Grype HIGH/CRITICAL
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          with open("grype-backend.json", "r", encoding="utf-8") as fh:
              report = json.load(fh)

          findings = [
              match
              for match in report.get("matches", [])
              if match.get("vulnerability", {}).get("severity", "").upper() in {"HIGH", "CRITICAL"}
          ]

          print(f"Grype HIGH/CRITICAL findings: {len(findings)}")
          for finding in findings[:20]:
              vuln = finding.get("vulnerability", {})
              artifact = finding.get("artifact", {})
              print(
                  f"- {vuln.get('id')} severity={vuln.get('severity')} "
                  f"package={artifact.get('name')} version={artifact.get('version')}"
              )

          if findings:
              sys.exit(1)
          PY

      - name: Upload Trivy Backend Report
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'
        continue-on-error: true

      - name: Upload Trivy Frontend Report
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
        continue-on-error: true

      - name: Verify Container Security Evidence Files
        if: always()
        run: |
          set -euo pipefail
          test -f trivy-backend.sarif
          test -f trivy-frontend.sarif
          test -f trivy-frontend-status.json
          test -f sbom-backend.json
          test -f grype-backend.json

      - name: Upload Container Security Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
            trivy-frontend-status.json
            sbom-backend.json
            grype-backend.json
          retention-days: 30
          if-no-files-found: error

  # Secrets Detection
  secrets-detection:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate Gitleaks config (parse gate)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint /bin/sh \
            zricethezav/gitleaks:v8.18.2@sha256:eadfe256fa18d6a78a717abc9ed454c8e03865d1c46d627bca83977f4424901a \
            -lc 'mkdir -p /tmp/gitleaks-empty && gitleaks detect --source /tmp/gitleaks-empty --no-git --config .gitleaks.toml --report-format json --report-path /tmp/gitleaks-parse.json --exit-code 0'

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Security Headers Check
  security-headers:
    name: Security Headers Verification
    runs-on: ubuntu-latest
    needs: [python-security, frontend-security]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-db.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Security Headers Tests
        run: pytest ../tests/backend/pytest/test_security_headers.py -q
